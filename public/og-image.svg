<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="150" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- DevOS Brand Icon Container -->
  <g transform="translate(100, 110)">
    <rect width="72" height="72" rx="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
    <path d="M24 24 L38 36 L24 48" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="38" y1="48" x2="48" y2="48" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Logo Text -->
  <text x="190" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">DevOS</text>
  <text x="325" y="158" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="500" fill="#10b981">/ dev-os.app</text>

  <!-- Main Headline -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
    Your Developer Operating System
  </text>

  <!-- Subheadline -->
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
    All-in-one workspace for learning, projects, goals, habits, jobs, notes
  </text>
  <text x="100" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
    and live coding profiles (LeetCode, Codeforces &amp; GitHub) in one place.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="110" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">⚡ Coding Profiles Sync</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="220" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="345" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">🎯 Goals &amp; Habit Tracker</text>

    <!-- Pill 3 -->
    <rect x="470" y="0" width="210" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="575" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">💼 Job Tracker &amp; Resume</text>

    <!-- Pill 4 -->
    <rect x="695" y="0" width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="785" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">⏱️ Focus Timer</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(100, 545)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#334155" stroke-width="1" opacity="0.6" />
    <text x="0" y="35" font-family="'Courier New', Courier, monospace" font-size="16" fill="#64748b">Free for developers • Built for engineers • https://www.dev-os.app</text>
    <text x="1000" y="35" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#10b981">Learn. Build. Track. Ship.</text>
  </g>
</svg>
