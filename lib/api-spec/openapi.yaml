components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    # ---------- PROFILE ----------
    Profile:
      type: object
      required: [userId, theme, accentColor, timezone, createdAt]
      properties:
        userId: { type: string }
        displayName: { type: ["string", "null"] }
        theme: { type: string, enum: [dark, light, amoled] }
        accentColor: { type: string }
        timezone: { type: string }
        dashboardLayout: { type: ["object", "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      properties:
        displayName: { type: string }
        theme: { type: string, enum: [dark, light, amoled] }
        accentColor: { type: string }
        timezone: { type: string }
        dashboardLayout: { type: object, additionalProperties: true }

    # ---------- DASHBOARD ----------
    DashboardSummary:
      type: object
      required:
        - productivityScore
        - todayStudyMinutes
        - todayCodingMinutes
        - tasksToday
        - upcomingDeadlines
        - recentNotes
        - activeProjects
        - jobPipeline
        - codingProfiles
        - resumeStatus
        - habits
        - unreadNotifications
      properties:
        productivityScore: { type: integer }
        todayStudyMinutes: { type: integer }
        todayCodingMinutes: { type: integer }
        currentStreakDays: { type: integer }
        tasksToday:
          type: array
          items: { $ref: "#/components/schemas/DailyTask" }
        upcomingDeadlines:
          type: array
          items: { $ref: "#/components/schemas/UpcomingDeadline" }
        recentNotes:
          type: array
          items: { $ref: "#/components/schemas/Note" }
        activeProjects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        jobPipeline:
          type: object
          additionalProperties: { type: integer }
        codingProfiles:
          type: array
          items: { $ref: "#/components/schemas/CodingProfile" }
        resumeStatus:
          type: ["object", "null"]
          properties:
            hasPrimary: { type: boolean }
            atsScore: { type: ["integer", "null"] }
        habits:
          type: array
          items: { $ref: "#/components/schemas/Habit" }
        unreadNotifications: { type: integer }

    # ---------- SEARCH ----------
    SearchResultItem:
      type: object
      required: [type, id, title, url]
      properties:
        type: { type: string }
        id: { type: string }
        title: { type: string }
        subtitle: { type: ["string", "null"] }
        url: { type: string }
    SearchResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResultItem" }

    # ---------- NOTIFICATIONS ----------
    Notification:
      type: object
      required: [id, type, title, message, read, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        relatedUrl: { type: ["string", "null"] }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    UnreadCount:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    # ---------- LEARNING: SUBJECTS ----------
    Subject:
      type: object
      required: [id, name, color, icon, isDefault, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        color: { type: string }
        icon: { type: string }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
    SubjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
        icon: { type: string }
    SubjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
        icon: { type: string }

    # ---------- LEARNING: FOLDERS ----------
    LearningFolder:
      type: object
      required: [id, subjectId, name, createdAt]
      properties:
        id: { type: integer }
        subjectId: { type: integer }
        parentFolderId: { type: ["integer", "null"] }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    LearningFolderInput:
      type: object
      required: [subjectId, name]
      properties:
        subjectId: { type: integer }
        parentFolderId: { type: integer }
        name: { type: string, minLength: 1 }
    LearningFolderUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        parentFolderId: { type: ["integer", "null"] }

    # ---------- LEARNING: TOPICS ----------
    TopicType:
      type: string
      enum:
        - youtube_video
        - youtube_playlist
        - drive_folder
        - drive_file
        - github_repo
        - website
        - documentation
        - article
        - pdf
        - book
        - course
        - note
    Topic:
      type: object
      required: [id, subjectId, title, type, priority, completed, progressPercent, revisionCount, studyTimeMinutes, createdAt, updatedAt]
      properties:
        id: { type: integer }
        subjectId: { type: integer }
        folderId: { type: ["integer", "null"] }
        title: { type: string }
        type: { $ref: "#/components/schemas/TopicType" }
        url: { type: ["string", "null"] }
        thumbnailUrl: { type: ["string", "null"] }
        durationSeconds: { type: ["integer", "null"] }
        channel: { type: ["string", "null"] }
        author: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        priority: { type: string, enum: [low, medium, high] }
        deadline: { type: ["string", "null"], format: date }
        completed: { type: boolean }
        progressPercent: { type: integer }
        revisionCount: { type: integer }
        studyTimeMinutes: { type: integer }
        lastWatchedAt: { type: ["string", "null"], format: date-time }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TopicInput:
      type: object
      required: [subjectId, title, type]
      properties:
        subjectId: { type: integer }
        folderId: { type: integer }
        title: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/TopicType" }
        url: { type: string }
        thumbnailUrl: { type: string }
        durationSeconds: { type: integer }
        channel: { type: string }
        author: { type: string }
        description: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        deadline: { type: string, format: date }
        tags:
          type: array
          items: { type: string }
    TopicUpdate:
      type: object
      properties:
        folderId: { type: ["integer", "null"] }
        title: { type: string, minLength: 1 }
        url: { type: string }
        thumbnailUrl: { type: string }
        durationSeconds: { type: integer }
        channel: { type: string }
        author: { type: string }
        description: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        deadline: { type: ["string", "null"], format: date }
        completed: { type: boolean }
        progressPercent: { type: integer }
        revisionCount: { type: integer }
        studyTimeMinutes: { type: integer }
        lastWatchedAt: { type: string, format: date-time }
        tags:
          type: array
          items: { type: string }
    FetchMetadataInput:
      type: object
      required: [url]
      properties:
        url: { type: string }
    UrlMetadata:
      type: object
      required: [url]
      properties:
        url: { type: string }
        title: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        thumbnailUrl: { type: ["string", "null"] }
        siteName: { type: ["string", "null"] }

    # ---------- NOTES ----------
    NoteFolder:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: integer }
        parentId: { type: ["integer", "null"] }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    NoteFolderInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        parentId: { type: integer }
    NoteFolderUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        parentId: { type: ["integer", "null"] }
    Note:
      type: object
      required: [id, title, contentMarkdown, pinned, archived, tags, createdAt, updatedAt]
      properties:
        id: { type: integer }
        folderId: { type: ["integer", "null"] }
        title: { type: string }
        contentMarkdown: { type: string }
        tags:
          type: array
          items: { type: string }
        pinned: { type: boolean }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NoteInput:
      type: object
      required: [title]
      properties:
        folderId: { type: integer }
        title: { type: string, minLength: 1 }
        contentMarkdown: { type: string }
        tags:
          type: array
          items: { type: string }
    NoteUpdate:
      type: object
      properties:
        folderId: { type: ["integer", "null"] }
        title: { type: string, minLength: 1 }
        contentMarkdown: { type: string }
        tags:
          type: array
          items: { type: string }
        pinned: { type: boolean }
        archived: { type: boolean }
    NoteVersion:
      type: object
      required: [id, noteId, contentMarkdown, createdAt]
      properties:
        id: { type: integer }
        noteId: { type: integer }
        contentMarkdown: { type: string }
        createdAt: { type: string, format: date-time }

    # ---------- CODING PROFILES ----------
    CodingPlatform:
      type: string
      enum:
        - github
        - leetcode
        - codeforces
        - codechef
        - atcoder
        - hackerrank
        - hackerearth
        - geeksforgeeks
        - cses
        - spoj
        - topcoder
    CodingSyncStatus:
      type: string
      enum: [pending, ok, error, unsupported]
    CodingProfile:
      type: object
      required: [id, platform, usernameOrHandle, profileUrl, syncStatus, createdAt]
      properties:
        id: { type: integer }
        platform: { $ref: "#/components/schemas/CodingPlatform" }
        usernameOrHandle: { type: string }
        profileUrl: { type: string }
