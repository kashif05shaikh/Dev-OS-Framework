openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DevOS API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: profile
  - name: dashboard
  - name: search
  - name: notifications
  - name: learning
  - name: notes
  - name: coding
  - name: projects
  - name: jobs
  - name: resumes
  - name: resources
  - name: ai
  - name: devtools
  - name: network
  - name: calendar
  - name: goals
  - name: focus
  - name: analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ===================== PROFILE =====================
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    patch:
      operationId: updateProfile
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }

